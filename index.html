<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J'Art Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --gold: #d4af37; --text: #f5f5f7; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding-bottom: 50px; }
    
    /* Fejléc & Menü */
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #1a1a1a; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 20px; font-weight: bold; color: var(--gold); text-decoration: none; }
    .menu-btn { background: none; border: 1px solid var(--gold); color: var(--gold); font-size: 20px; padding: 5px 12px; border-radius: 4px; cursor: pointer; }
    
    nav { display: none; position: absolute; top: 100%; right: 0; width: 100%; background: #1a1a1a; border-bottom: 1px solid #333; text-align: center; }
    nav.active { display: block; }
    nav a { display: block; padding: 15px; color: var(--text); text-decoration: none; border-top: 1px solid #222; }
    nav a:hover { background: #252525; color: var(--gold); }

    /* Hero section */
    .hero { text-align: center; padding: 60px 20px; background: #181818; border-bottom: 1px solid #222; }
    .hero h1 { font-size: 32px; color: var(--gold); margin-bottom: 10px; }
    .hero p { color: #aaa; font-size: 16px; }

    /* Kategóriák és Termékek */
    .container { max-width: 1000px; margin: auto; padding: 20px; }
    .cat-title { font-size: 24px; color: var(--gold); margin: 30px 0 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .card { background: var(--card); border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
    .card img { width: 100%; height: 220px; object-fit: cover; background: #252525; }
    .card-body { padding: 15px; display: flex; flex-direction: column; flex: 1; }
    .card-title { font-size: 18px; margin-bottom: 5px; }
    .card-price { color: var(--gold); font-weight: bold; font-size: 16px; margin-bottom: 10px; }
    .card-desc { font-size: 14px; color: #aaa; flex: 1; }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">J'Art Studio</a>
    <button class="menu-btn" id="menuToggle">☰</button>
    <nav id="navMenu">
      <a href="#festmenyek">Festmények</a>
      <a href="#szen">Szén és grafika</a>
      <a href="#dekor">3D Dekoráció</a>
      <a href="#egyeb">Egyéb</a>
      <a href="/admin.html">Admin</a>
    </nav>
  </header>

  <section class="hero">
    <h1>J'Art Studio</h1>
    <p>A kreativitás szabad tere.</p>
  </section>

  <div class="container">
    <h2 class="cat-title" id="festmenyek">Festmények</h2>
    <div class="grid" id="grid-Festmények">Betöltés...</div>

    <h2 class="cat-title" id="szen">Szén és grafika</h2>
    <div class="grid" id="grid-Szén és grafika">Betöltés...</div>

    <h2 class="cat-title" id="dekor">3D Dekoráció</h2>
    <div class="grid" id="grid-3D Dekoráció">Betöltés...</div>

    <h2 class="cat-title" id="egyeb">Egyéb</h2>
    <div class="grid" id="grid-Egyéb">Betöltés...</div>
  </div>

  <script>
    // Menü megnyitása/bezárása
    const menuBtn = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');
    menuBtn.addEventListener('click', () => {
      navMenu.classList.toggle('active');
    });

    // Supabase beállítások
    const SUPABASE_URL = 'https://kqwvvueibagfoexofwuu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_iaBMUObVjd_zfHC5deYqdw_ewgIQa0o';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadWebpageProducts() {
      const { data, error } = await sb.from('termekek').select('*').order('sorrend', { ascending: true });
      if (error) { console.error(error); return; }

      const categories = ['Festmények', 'Szén és grafika', '3D Dekoráció', 'Egyéb'];
      
      categories.forEach(cat => {
        const grid = document.getElementById(`grid-${cat}`);
        const items = data.filter(p => p.kategoria === cat);

        if (!items.length) {
          grid.innerHTML = '<p style="color:#666;">Nincs még feltöltött alkotás ebben a kategóriában.</p>';
        } else {
          grid.innerHTML = items.map(p => `
            <div class="card">
              <img src="${p.kep_url}" alt="${p.nev}" loading="lazy">
              <div class="card-body">
                <div class="card-title">${p.nev}</div>
                <div class="card-price">${p.ar}</div>
                <div class="card-desc">${p.leiras || ''}</div>
              </div>
            </div>
          `).join('');
        }
      });
    }

    loadWebpageProducts();
  </script>

</body>
</html>
